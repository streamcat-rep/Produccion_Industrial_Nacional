name: Actualizar datos del INE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *" # día 1 de cada mes, 05:00 UTC

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar del INE y regenerar data/
        run: python scripts/actualizar.py
      - name: Guardar cambios
        run: |
          # Si solo cambia la fecha de generación, no hay nada nuevo que publicar.
          if [ -z "$(git status --porcelain -- data/crudo)" ]; then
            echo "El INE no ha publicado cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Datos del INE actualizados"
          git push
